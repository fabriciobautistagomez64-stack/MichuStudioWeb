services:
  - type: web
    name: michustudio-web-account
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: TOKEN_TTL_SECONDS
        value: "604800"
      - key: MAX_SESSION_SECONDS
        value: "2592000"
      - key: LEGACY_AUTH
        value: "false"
      - key: ALLOW_ADMIN_KEY_HEADER
        value: "false"
      - key: DB_SSL_INSECURE
        value: "false"
      - key: MODERATE_MAIL
        value: "true"
